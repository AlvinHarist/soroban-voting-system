<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stellar Voting DApp</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
      padding: 40px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 40px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #334155;
      color: white;
    }

    button {
      margin-top: 15px;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .candidate {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-radius: 10px;
      background: #334155;
      margin-top: 15px;
    }

    .candidate-info h3 {
      margin-bottom: 8px;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      background: #14532d;
      display: none;
    }

    .warning {
      background: #7f1d1d;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🗳 Stellar Voting DApp</h1>

    <div class="card">
      <h2>Contract Configuration</h2>

      <input type="text" id="contractId" placeholder="Enter Contract ID" />

      <button onclick="saveContractId()">
        Save Contract ID
      </button>
    </div>

    <div class="card">
      <h2>Add Candidate</h2>

      <input type="text" id="candidateName" placeholder="Candidate name" />

      <button onclick="addCandidate()">
        Add Candidate
      </button>
    </div>

    <div class="card">
      <h2>Candidates</h2>

      <div id="candidateList"></div>

      <button onclick="loadCandidates()">
        Refresh Candidates
      </button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script>
    // Dummy candidate data sementara
    let candidates = [
      {
        id: 1,
        name: 'Alice',
        vote_count: 3,
      },
      {
        id: 2,
        name: 'Bob',
        vote_count: 1,
      }
    ];

    function showStatus(message, isError = false) {
      const status = document.getElementById('status');

      status.style.display = 'block';
      status.innerText = message;

      if (isError) {
        status.classList.add('warning');
      } else {
        status.classList.remove('warning');
      }
    }

    function saveContractId() {
      const contractId = document.getElementById('contractId').value;

      if (!contractId) {
        showStatus('Please enter contract ID', true);
        return;
      }

      localStorage.setItem('contractId', contractId);

      showStatus('Contract ID saved');
    }

    function addCandidate() {
      const name = document.getElementById('candidateName').value;

      if (!name) {
        showStatus('Candidate name is required', true);
        return;
      }

      // TODO:
      // Connect to Soroban smart contract:
      // add_candidate(name)

      candidates.push({
        id: candidates.length + 1,
        name,
        vote_count: 0,
      });

      document.getElementById('candidateName').value = '';

      loadCandidates();

      showStatus(`Candidate ${name} added`);
    }

    function voteCandidate(id) {
      // TODO:
      // Connect to Soroban smart contract:
      // vote(voter, candidate_id)

      const candidate = candidates.find(c => c.id === id);

      if (!candidate) {
        showStatus('Candidate not found', true);
        return;
      }

      candidate.vote_count += 1;

      loadCandidates();

      showStatus(`Successfully voted for ${candidate.name}`);
    }

    function loadCandidates() {
      const container = document.getElementById('candidateList');

      container.innerHTML = '';

      candidates.forEach(candidate => {
        const div = document.createElement('div');

        div.className = 'candidate';

        div.innerHTML = `
          <div class="candidate-info">
            <h3>${candidate.name}</h3>
            <p>Total Votes: ${candidate.vote_count}</p>
          </div>

          <button onclick="voteCandidate(${candidate.id})">
            Vote
          </button>
        `;

        container.appendChild(div);
      });
    }

    loadCandidates();
  </script>

</body>
</html>
